<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dance Assessment - Questionnaire</title>
    <link rel="shortcut icon" type="image/x-icon" href="image/favicon.ico" />
    <link rel="stylesheet" href="styles/styles.css" />
  </head>
  <body>
    <!-- Logo Section (center) -->
    <a href="#job-section">
      <section id="logo-section" class="logo-section">
        <div class="logo-container">
          <div class="logo">
            <div class="logo-icon">
              <svg viewBox="0 0 100 100" width="120" height="120">
                <!-- Dancing figure silhouette -->
                <circle cx="50" cy="30" r="12" fill="#333" />
                <ellipse cx="50" cy="55" rx="15" ry="20" fill="#333" />
                <path d="M35,75 Q35,85 30,90 L25,90 Q30,85 30,75 Z" fill="#333" />
                <path d="M65,75 Q65,85 70,90 L75,90 Q70,85 70,75 Z" fill="#333" />
                <path d="M40,50 Q30,45 25,50 L20,45 Q30,40 40,50 Z" fill="#333" />
                <path d="M60,50 Q70,45 75,50 L80,45 Q70,40 60,50 Z" fill="#333" />
              </svg>
            </div>
            <h1 class="logo-text">Dance Assessment</h1>
          </div>
          <p class="scroll-instruction">click anywhere to start</p>
        </div>
      </section>
    </a>

    <!-- Dance Questionnaire Section (scroll down from logo) -->
    <section id="job-section" class="chat-section job-theme">
      <div class="chat-container">
        <div class="header">
          <div class="logo-small">Dance Assessment</div>
          <div class="briefcase-icon">💃</div>
        </div>
        <div class="chat-messages" id="job-messages">
          <div class="message ai-message">
            <div class="message-bubble blue">
              Hello! Welcome to the Dance Assessment Questionnaire. I'm here to learn about your dance knowledge and preferences. Let's begin! What is your name?
            </div>
          </div>
        </div>
        <div class="input-container">
          <input
            type="text"
            id="job-input"
            placeholder="Type to say something..."
            class="chat-input blue-input"
          />
          <button id="job-send" class="send-button blue-button">➤</button>
        </div>
        <div class="typing-indicator" id="job-typing" style="display: none">
          <div class="typing-dots">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
        <div class="profile-display" id="job-profile" style="display: none">
        <div class="profile-card blue-card">
          <div class="profile-header">Your Dance Assessment is Complete! 💃</div>
          <div class="profile-content" id="job-profile-content"></div>
          <button id="apply-button" class="apply-button">Finish</button>
        </div>
      </div>
    </section>


    <script src="scripts/script.js"></script>
  </body>
</html>
